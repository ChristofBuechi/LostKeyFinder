name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [prod]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event_name == 'workflow_run' && 'dev' || inputs.environment }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm ci
      - run: npm run build:web
      - name: Build and push API image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/api:${{ env.DEPLOY_SHA }}
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          gcloud run deploy lost-key-finder-api \
            --image "$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars "^|^NODE_ENV=production|APP_VERSION=${{ env.DEPLOY_SHA }}|ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}|SUPABASE_URL=${{ vars.SUPABASE_URL }}|SUPABASE_JWT_AUDIENCE=${{ vars.SUPABASE_JWT_AUDIENCE }}|SUPABASE_JWT_ALGORITHM=${{ vars.SUPABASE_JWT_ALGORITHM }}" \
            --set-secrets "FIRESTORE_MONGODB_URI=${{ vars.FIRESTORE_MONGODB_URI_SECRET }}:latest,SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY_SECRET }}:latest" \
            --quiet
      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}"
