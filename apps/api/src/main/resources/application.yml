spring:
  profiles:
    default: dev
  application:
    name: lost-key-finder-api
  data:
    mongodb:
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:3000}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo
api:
  version: ${APP_VERSION:0.1.0}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
springdoc:
  writer-with-order-by-keys: true
  api-docs:
    version: OPENAPI_3_0
  paths-to-match: /api/v1/**
tags:
  public-base-url: ${TAG_PUBLIC_BASE_URL:}
rate-limits:
  hmac-key: ${PUBLIC_RATE_LIMIT_HMAC_KEY:}

chat-mail:
  host: ${CHAT_SMTP_HOST:}
  port: ${CHAT_SMTP_PORT:587}
  username: ${CHAT_SMTP_USERNAME:}
  password: ${CHAT_SMTP_PASSWORD:}
  from: ${CHAT_MAIL_FROM:}
  start-tls: ${CHAT_SMTP_START_TLS:true}
  job-audience: ${CHAT_NOTIFICATION_JOB_AUDIENCE:}
  job-service-account: ${CHAT_NOTIFICATION_JOB_SERVICE_ACCOUNT:}
