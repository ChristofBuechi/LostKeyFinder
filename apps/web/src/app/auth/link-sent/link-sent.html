<section class="auth-panel sent-panel" aria-labelledby="sent-title">
  <span class="sent-mark" aria-hidden="true">✓</span>
  <h1 id="sent-title">{{ language.copy().linkSentTitle }}</h1>
  <p>{{ language.copy().linkSentIntro }}</p>
  <p class="close-note">{{ language.copy().linkSentClose }}</p>
  <p>{{ language.copy().linkSentSpam }}</p>
  <p class="device-note">{{ language.copy().linkSentDevice }}</p>
  <a routerLink="/" fragment="owner">{{ language.copy().requestAnotherLink }}</a>
</section>
