<section class="auth-panel sent-panel" aria-labelledby="sent-title">
  <span class="sent-mark" aria-hidden="true">✓</span>
  <h1 id="sent-title">{{ ('common.linkSentTitle' | transloco) }}</h1>
  <p>{{ ('common.linkSentIntro' | transloco) }}</p>
  <p class="close-note">{{ ('common.linkSentClose' | transloco) }}</p>
  <p>{{ ('common.linkSentSpam' | transloco) }}</p>
  <p class="device-note">{{ ('common.linkSentDevice' | transloco) }}</p>
  <a routerLink="/" fragment="owner">{{ ('common.requestAnotherLink' | transloco) }}</a>
</section>
